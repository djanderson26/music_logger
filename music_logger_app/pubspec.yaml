name: music_logger_app
description: A personal music journaling and tracking app.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.5.1
  # Image caching
  cached_network_image: ^3.3.1
  # Icons
  cupertino_icons: ^1.0.6
  # Environment variables
  flutter_dotenv: ^5.1.0
  # Navigation
  go_router: ^13.2.0
  # Local storage
  hive_flutter: ^1.1.0
  # Networking
  http: ^1.2.1
  # Date / number formatting
  intl: ^0.19.0
  # Open external URLs (Spotify, Apple Music)
  url_launcher: ^6.2.6
  # YouTube embeds
  youtube_player_flutter: ^9.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Hive code generation
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
  fonts: []
    # Add custom fonts here:
    # - family: MyFont
    #   fonts:
    #     - asset: assets/fonts/MyFont-Regular.ttf
